[project]
name = "assay"
version = "2.0.0"
description = "OSV vulnerability summaries for Cloudsmith workspaces and repositories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests", "rich"]

[project.scripts]
assay = "assay:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["assay"]
